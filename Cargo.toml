[package]
name = "stealthgame"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["serialize", "debug"] }
bevy_dylib = "0.20.1"
physics = { version = "0.8.0", package = "avian2d" }
postcard = { version = "1.1.3", features = ["use-std"] }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
log = { version = "*", features = [
    "max_level_debug",
    "release_max_level_warn",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
